# Managed by Twine deployment. TLS keys stay in Certbot's /etc/letsencrypt tree.
server {
    listen 80;
    listen [::]:80;
    server_name twineprotein.com www.twineprotein.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://twineprotein.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.twineprotein.com;

    ssl_certificate /etc/letsencrypt/live/twineprotein.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twineprotein.com/privkey.pem;

    return 301 https://twineprotein.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name twineprotein.com;

    ssl_certificate /etc/letsencrypt/live/twineprotein.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twineprotein.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
