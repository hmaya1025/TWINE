# Managed by Twine deployment. TLS keys stay in Certbot's /etc/letsencrypt tree.
server {
    listen 80;
    listen [::]:80;
    server_name twineprotein.com www.twineprotein.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://twineprotein.com$request_uri;
    }
}
