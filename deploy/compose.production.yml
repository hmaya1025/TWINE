name: twine-production

services:
  twine-frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: twineprotein/frontend:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - twine-web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  twine-web:
    name: twine-production-network
    driver: bridge
