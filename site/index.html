<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TWINE</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111713; color: #f5f5ef; }
      main { width: min(90vw, 680px); padding: 3rem; border: 1px solid #35423a; border-radius: 1rem; background: #18211b; }
      p { color: #bac7bd; line-height: 1.6; }
      h1 { margin: 0; letter-spacing: .16em; font-size: clamp(2.5rem, 9vw, 5rem); }
      .status { margin-top: 2rem; color: #a9d7bd; font-size: .875rem; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <h1>TWINE</h1>
      <p>Estamos preparando este sitio.</p>
      <p class="status">Despliegue conectado</p>
    </main>
  </body>
</html>
